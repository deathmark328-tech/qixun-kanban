<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="启洵的今天">
<meta name="theme-color" content="#ffd9a0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>启洵的今天 · 小看板</title>
<style>
  :root{
    --bg:#fff9ef; --ink:#3a2f2a; --line:#3a2f2a;
    --todo:#ffd9a0; --doing:#b6e3ff; --done:#b9edc4;
    --card:#fffdf8; --sh:0 6px 0 rgba(58,47,42,.16);
    --yes:#8fdc9f; --no:#ffc2b0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
     -webkit-user-select:none;user-select:none;touch-action:manipulation}
  html,body{height:100%}
  body{
    margin:0; color:var(--ink); overflow:hidden;
    font-family:"LXGW WenKai","霞鹜文楷","Noto Sans CJK SC",sans-serif;
    background:
      radial-gradient(circle at 10% 6%, #ffe9c7 0 16%, transparent 16.5%),
      radial-gradient(circle at 90% 94%, #d9f2e4 0 15%, transparent 15.5%),
      var(--bg);
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  }
  header{display:flex; align-items:center; gap:12px; padding:12px 20px 4px}
  .avatar{font-size:36px; line-height:1; filter:drop-shadow(0 3px 0 rgba(0,0,0,.12))}
  .ttl h1{font-size:27px; margin:0; letter-spacing:1px; line-height:1.05}
  .ttl .py{font-family:"DejaVu Sans",sans-serif; font-size:10px; font-weight:700; color:#a08a76; letter-spacing:.6px; margin-top:2px}
  .ttl .en{font-family:"DejaVu Sans",sans-serif; font-size:9px; font-weight:900; color:#b9a58f; letter-spacing:1px}
  .spacer{flex:1}

  .btn{
    border:3px solid var(--line); background:#fff; border-radius:999px;
    padding:7px 16px; font:inherit; font-size:16px; font-weight:700; cursor:pointer;
    box-shadow:var(--sh); line-height:1.15; text-align:center;
  }
  .btn small{display:block; font-family:"DejaVu Sans",sans-serif; font-size:8.5px; font-weight:900;
             letter-spacing:.6px; color:#a08a76; margin-top:1px}
  .btn:active{transform:translateY(3px); box-shadow:0 3px 0 rgba(58,47,42,.16)}
  .seg{display:flex; background:#fff; border:3px solid var(--line); border-radius:999px;
       overflow:hidden; box-shadow:var(--sh)}
  .seg button{border:0; background:transparent; padding:7px 18px; font:inherit; font-size:16px;
              font-weight:700; color:#9d8a78; cursor:pointer; line-height:1.15}
  .seg button small{display:block; font-family:"DejaVu Sans",sans-serif; font-size:8px;
                    font-weight:900; letter-spacing:.5px; opacity:.75}
  .seg button.on{background:var(--todo); color:var(--ink)}

  .board{height:calc(100% - 74px); display:grid; grid-template-columns:1fr 1fr 1fr;
         gap:12px; padding:6px 16px 14px}
  .col{border:4px solid var(--line); border-radius:24px; padding:8px; display:flex;
       flex-direction:column; min-height:0; box-shadow:var(--sh); transition:outline .1s}
  .col.todo{background:linear-gradient(#ffe7c2,#ffe0b0)}
  .col.doing{background:linear-gradient(#cfeaff,#bde0fb)}
  .col.done{background:linear-gradient(#cdf3d6,#b6ecc2)}
  .col.over{outline:5px dashed rgba(58,47,42,.42); outline-offset:-8px}

  .colhead{display:flex; align-items:center; gap:7px; padding:2px 8px 8px}
  .colhead .em{font-size:22px}
  .colhead .nm{font-size:17px; font-weight:700; line-height:1.1}
  .colhead .nm small{display:block; font-family:"DejaVu Sans",sans-serif; font-size:8px;
                     font-weight:900; color:#7b6a5c; letter-spacing:.5px; opacity:.75}
  .colhead .cnt{margin-left:auto; background:#fff; border:3px solid var(--line); border-radius:999px;
                min-width:34px; text-align:center; padding:0 9px; font-size:15px; font-weight:700}
  .zone{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:7px; padding:1px}
  .zone::-webkit-scrollbar{width:6px}
  .zone::-webkit-scrollbar-thumb{background:rgba(58,47,42,.18); border-radius:6px}

  .wrap{position:relative; border-radius:16px; overflow:hidden; flex:0 0 auto}
  .hint{position:absolute; inset:0; display:flex; align-items:center; padding:0 14px;
        font-size:16px; font-weight:700; gap:6px; opacity:0; transition:opacity .08s}
  .hint small{font-family:"DejaVu Sans",sans-serif; font-size:8.5px; font-weight:900; letter-spacing:.4px}
  .hint.l{background:var(--yes); justify-content:flex-start}
  .hint.r{background:var(--no); justify-content:flex-end}

  .card{
    position:relative; display:flex; align-items:center; gap:9px; background:var(--card);
    border:3px solid var(--line); border-radius:16px; padding:6px 9px;
    box-shadow:0 4px 0 rgba(58,47,42,.16); will-change:transform;
  }
  .card .ic{font-size:28px; line-height:1; width:38px; text-align:center; flex:0 0 auto}
  .card .tx{flex:1; min-width:0}
  .card .py{font-family:"DejaVu Sans",sans-serif; font-size:9px; font-weight:700; color:#94816f;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .card .cn{font-size:19px; font-weight:700; line-height:1.12; white-space:nowrap}
  .card .en{font-family:"DejaVu Sans",sans-serif; font-size:9px; font-weight:900; color:#000;
            letter-spacing:.3px; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .card .tick{font-size:18px; opacity:0}
  .col.done .card{background:#f3fff6}
  .col.done .card .tick{opacity:1}
  .col.done .card .cn{text-decoration:line-through; text-decoration-thickness:2.5px; color:#5c7a62}

  .card.hold{animation:wig .25s infinite alternate}
  @keyframes wig{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
  .card.floating{position:fixed; z-index:500; margin:0; pointer-events:none;
                 transform:scale(1.06) rotate(-2deg); box-shadow:0 14px 24px rgba(0,0,0,.25)}

  .mask{position:fixed; inset:0; background:rgba(58,47,42,.45); display:none;
        align-items:center; justify-content:center; z-index:9000; padding:20px}
  .mask.on{display:flex}
  .ask{
    background:#fff9ef; border:5px solid var(--line); border-radius:30px;
    padding:20px 22px 18px; text-align:center; max-width:460px; width:100%;
    box-shadow:0 12px 0 rgba(58,47,42,.25); animation:pop .18s ease-out;
  }
  @keyframes pop{from{transform:scale(.88); opacity:.4}to{transform:scale(1); opacity:1}}
  .ask .big{font-size:62px; line-height:1}
  .ask .q{font-size:27px; font-weight:700; margin-top:6px; letter-spacing:1px}
  .ask .qpy{font-family:"DejaVu Sans",sans-serif; font-size:11px; font-weight:700; color:#a08a76; margin-top:2px}
  .ask .qen{font-family:"DejaVu Sans",sans-serif; font-size:10px; font-weight:900; color:#b9a58f; letter-spacing:1px; margin-top:1px}
  .ask .item{display:flex; align-items:center; justify-content:center; gap:8px; margin:12px 0 6px;
             font-size:16px; color:#6b5a4c}
  .ask .row{display:flex; gap:12px; margin-top:16px}
  .ask .row button{flex:1; border:4px solid var(--line); border-radius:20px; padding:11px 6px;
                   font:inherit; font-size:19px; font-weight:700; cursor:pointer;
                   box-shadow:0 5px 0 rgba(58,47,42,.2)}
  .ask .row button small{display:block; font-family:"DejaVu Sans",sans-serif; font-size:9px;
                         font-weight:900; letter-spacing:.5px; opacity:.65; margin-top:2px}
  .ask .yes{background:var(--yes)} .ask .no{background:#fff}
  .ask .yes.danger{background:#ffb38a}
  .ask .row button:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(58,47,42,.2)}

  .spark{position:fixed; pointer-events:none; font-size:24px; animation:sp .9s ease-out forwards; z-index:9998}
  @keyframes sp{0%{transform:translate(0,0) scale(.6);opacity:1}
                100%{transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--rot));opacity:0}}
  .party{position:fixed; inset:0; display:none; align-items:center; justify-content:center;
         background:#fff6e6; z-index:9999; flex-direction:column; gap:8px; text-align:center}
  .party.on{display:flex}
  .party .big{font-size:104px; animation:bounce 1s infinite alternate}
  @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-16px)}}
  .party h2{font-size:40px; margin:0; letter-spacing:3px}
  .party .py{font-family:"DejaVu Sans",sans-serif; font-size:12px; font-weight:700; color:#a08a76}
  .party p{font-size:18px; color:#8b7a6a; margin:2px 0 0}
  .party button{margin-top:14px; border:4px solid var(--line); background:var(--done);
                border-radius:999px; padding:11px 30px; font:inherit; font-size:20px;
                font-weight:700; cursor:pointer; box-shadow:0 6px 0 rgba(58,47,42,.18)}

  @media (max-width:820px){
    .ttl h1{font-size:20px} .board{gap:7px; padding:4px 8px 8px}
    .colhead .nm{font-size:14px} .card .cn{font-size:16px}
    .card .ic{font-size:23px; width:31px} .card .en,.card .py{font-size:8px}
    .btn{padding:6px 11px; font-size:14px} .seg button{padding:6px 12px; font-size:14px}
  }
</style>
</head>
<body>

<header>
  <div class="avatar">🐣</div>
  <div class="ttl">
    <h1>启洵的今天</h1>
    <div class="py">qǐ xún de jīn tiān</div>
    <div class="en">MARVIN'S DAY</div>
  </div>
  <div class="spacer"></div>
  <div class="seg">
    <button id="btnMorning" class="on">早上<small>ZǍO SHANG</small></button>
    <button id="btnNight">晚上<small>WǍN SHANG</small></button>
  </div>
  <button class="btn" id="btnReset">重来<small>CHÓNG LÁI</small></button>
</header>

<div class="board">
  <section class="col todo" data-col="todo">
    <div class="colhead"><span class="em">🌤️</span>
      <span class="nm">要做<small>YÀO ZUÒ · TO DO</small></span>
      <span class="cnt" id="cTodo">0</span></div>
    <div class="zone" id="zTodo"></div>
  </section>
  <section class="col doing" data-col="doing">
    <div class="colhead"><span class="em">✨</span>
      <span class="nm">正在做<small>ZHÈNG ZÀI ZUÒ · DOING</small></span>
      <span class="cnt" id="cDoing">0</span></div>
    <div class="zone" id="zDoing"></div>
  </section>
  <section class="col done" data-col="done">
    <div class="colhead"><span class="em">🎉</span>
      <span class="nm">做好了<small>ZUÒ HǍO LE · DONE</small></span>
      <span class="cnt" id="cDone">0</span></div>
    <div class="zone" id="zDone"></div>
  </section>
</div>

<div class="mask" id="mask">
  <div class="ask">
    <div class="big" id="askEmoji">✅</div>
    <div class="q" id="askQ">做好了吗？</div>
    <div class="qpy" id="askPy">zuò hǎo le ma?</div>
    <div class="qen" id="askEn">ARE YOU DONE?</div>
    <div class="item" id="askItem"></div>
    <div class="row">
      <button class="no"  id="askNo">不<small>BÙ · NO</small></button>
      <button class="yes" id="askYes">好<small>HǍO · YES</small></button>
    </div>
  </div>
</div>

<div class="party" id="party">
  <div class="big">🌟</div>
  <h2>太棒了！</h2>
  <div class="py">tài bàng le!</div>
  <p id="partySub">全部做完啦</p>
  <button id="partyClose">再来一次<small>zài lái yī cì</small></button>
</div>

<script>
const SETS = {
  morning:{label:"早上 · MORNING", items:[
    ["🌞","qǐ chuáng","起床","WAKE UP"],
    ["🚽","shàng cè suǒ","上厕所","TOILET"],
    ["🪥","shuā yá","刷牙","BRUSH TEETH"],
    ["🧼","xǐ liǎn","洗脸","WASH FACE"],
    ["👕","chuān yī fu","穿衣服","GET DRESSED"],
    ["🥣","chī zǎo cān","吃早餐","BREAKFAST"],
    ["🍱","zhuāng wǔ cān hé","装午餐盒","PACK LUNCHBOX"],
    ["👟","chuān xié","穿鞋","SHOES ON"],
    ["🎒","bēi shū bāo","背书包","BACKPACK ON"],
    ["🚪","chū mén","出门","OUT THE DOOR"]]},
  night:{label:"晚上 · NIGHT", items:[
    ["🧸","shōu wán jù","收玩具","TIDY TOYS"],
    ["🛁","xǐ zǎo","洗澡","BATH"],
    ["🪥","shuā yá","刷牙","BRUSH TEETH"],
    ["👕","chuān shuì yī","穿睡衣","PYJAMAS ON"],
    ["📖","dú gù shi","读故事","STORY TIME"],
    ["🌙","guān dēng shuì jiào","关灯睡觉","LIGHTS OUT"]]}
};

const KEY="qixun-kanban-v3";
let mode="morning";
let state={morning:{todo:[],doing:[],done:[]}, night:{todo:[],doing:[],done:[]}};
const COLS=["todo","doing","done"];
const ZONE={todo:"zTodo",doing:"zDoing",done:"zDone"};
const CNT={todo:"cTodo",doing:"cDoing",done:"cDone"};

let AC=null;
function beep(f=880,d=.12,t="sine",g=.05){
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),gn=AC.createGain();
    o.type=t;o.frequency.value=f;gn.gain.value=g;o.connect(gn);gn.connect(AC.destination);
    o.start();gn.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d);
  }catch(e){}
}
const chime=()=>{beep(660,.1);setTimeout(()=>beep(880,.1),110);setTimeout(()=>beep(1175,.18),220)};
const fanfare=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.2,"triangle",.06),i*160));

function todayKey(){return new Date().toDateString()}
function persist(){ try{localStorage.setItem(KEY,JSON.stringify({mode,state,day:todayKey()}))}catch(e){} }
function build(){
  state[mode].todo=SETS[mode].items.map((it,i)=>({id:mode+"-"+i,ic:it[0],py:it[1],cn:it[2],en:it[3]}));
  state[mode].doing=[]; state[mode].done=[];
  persist(); render();
}
function loadSaved(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||"null");
    if(!d||!d.state||d.day!==todayKey()) return false;
    state=d.state; mode=d.mode==="night"?"night":"morning";
    if(!state.morning||!state.night) return false;
    return true;
  }catch(e){return false}
}

function render(){
  COLS.forEach(k=>{
    const z=document.getElementById(ZONE[k]);
    z.innerHTML="";
    state[mode][k].forEach(it=>z.appendChild(wrapEl(it,k)));
    document.getElementById(CNT[k]).textContent=state[mode][k].length;
  });
  document.getElementById("btnMorning").classList.toggle("on",mode==="morning");
  document.getElementById("btnNight").classList.toggle("on",mode==="night");
}

function wrapEl(item,colKey){
  const wrap=document.createElement("div");
  wrap.className="wrap"; wrap.dataset.id=item.id; wrap.dataset.col=colKey;
  wrap.innerHTML='<div class="hint l">✅ 完成 <small>COMPLETE</small></div>'+
                 '<div class="hint r">🗑️ 删除 <small>DELETE</small></div>';
  const card=document.createElement("div");
  card.className="card"; card.dataset.id=item.id;
  card.innerHTML='<div class="ic">'+item.ic+'</div>'+
    '<div class="tx"><div class="py">'+item.py+'</div><div class="cn">'+item.cn+
    '</div><div class="en">'+item.en+'</div></div><div class="tick">✅</div>';
  wrap.appendChild(card);
  bindGesture(wrap,card,item,colKey);
  return wrap;
}

const LONG=420, MOVE=10, SWIPE=84;
function bindGesture(wrap,card,item,colKey){
  let sx=0,sy=0,t0=0,longTimer=null,holding=false,dragging=false,dx=0,dy=0,moved=false;
  const hintL=wrap.querySelector(".hint.l"), hintR=wrap.querySelector(".hint.r");

  function reset(){
    card.classList.remove("hold","floating");
    card.style.transform=""; card.style.left=""; card.style.top=""; card.style.width="";
    hintL.style.opacity=0; hintR.style.opacity=0;
  }

  card.addEventListener("pointerdown",e=>{
    if(!state[mode][colKey].some(x=>x.id===item.id)) return;
    sx=e.clientX; sy=e.clientY; t0=Date.now(); moved=false; dragging=false; holding=false;
    try{card.setPointerCapture(e.pointerId)}catch(err){}
    longTimer=setTimeout(()=>{
      holding=true;
      const r=card.getBoundingClientRect();
      card.classList.add("hold");
      beep(520,.07,"square",.035);
      card.style.width=r.width+"px";
    },LONG);
  });

  card.addEventListener("pointermove",e=>{
    if(!t0) return;
    dx=e.clientX-sx; dy=e.clientY-sy;
    if(Math.abs(dx)>MOVE||Math.abs(dy)>MOVE) moved=true;

    if(holding){
      if(!dragging && (Math.abs(dx)>6||Math.abs(dy)>6)){
        dragging=true;
        const r=card.getBoundingClientRect();
        card.classList.remove("hold"); card.classList.add("floating");
        card.style.left=r.left+"px"; card.style.top=r.top+"px"; card.style.width=r.width+"px";
      }
      if(dragging){
        card.style.left=(e.clientX-card.offsetWidth/2)+"px";
        card.style.top=(e.clientY-30)+"px";
        highlight(colAt(e.clientX,e.clientY));
      }
      return;
    }
    if(!moved) return;
    clearTimeout(longTimer);
    card.style.transform="translate("+Math.max(-120,Math.min(120,dx))+"px,0)";
    hintL.style.opacity = dx<0 ? Math.min(1,Math.abs(dx)/SWIPE) : 0;
    hintR.style.opacity = dx>0 ? Math.min(1,dx/SWIPE) : 0;
  });

  function end(e){
    clearTimeout(longTimer);
    if(!t0) return;
    t0=0;
    if(dragging){
      const target=colAt(e.clientX,e.clientY);
      dragging=false; holding=false;
      reset(); highlight(null);
      if(target && target!==colKey){ moveTo(item,colKey,target,true); }
      else render();
      return;
    }
    if(holding){ holding=false; reset(); return; }
    if(moved){
      const d=dx;
      reset();
      if(d<=-SWIPE)     askComplete(item);
      else if(d>=SWIPE) askDelete(item);
      else render();
      return;
    }
    reset();
    advance(item,colKey);
  }
  card.addEventListener("pointerup",end);
  card.addEventListener("pointercancel",()=>{
    clearTimeout(longTimer); reset(); holding=dragging=false; t0=0; render();
  });
}

function colAt(x,y){
  const el=document.elementFromPoint(x,y);
  const col=el&&el.closest?el.closest(".col"):null;
  return col?col.dataset.col:null;
}
function highlight(k){
  document.querySelectorAll(".col").forEach(c=>c.classList.toggle("over",c.dataset.col===k));
}

function findItem(id){
  for(const k of COLS){ const i=state[mode][k].findIndex(x=>x.id===id); if(i>=0) return [k,i]; }
  return [null,-1];
}
function moveTo(item,from,to,doChime){
  const [,i]=findItem(item.id); if(i<0) return;
  state[mode][from].splice(i,1);
  state[mode][to].push(item);
  persist();
  if(doChime && to==="done") chime();
  render(); checkAll();
}
function advance(item,colKey){
  const idx=COLS.indexOf(colKey);
  const to = idx===0?"doing": idx===1?"done":"todo";
  if(to==="done"){ askComplete(item); return; }
  moveTo(item,colKey,to,false); beep(520,.07,"sine",.035);
}

let pending=null;
function askComplete(item){
  pending={type:"complete",item};
  showAsk("✅","做好了吗？","zuò hǎo le ma?","ARE YOU DONE?",
          item.ic+" "+item.cn+" · "+item.en,
          {yes:"做好了",yesEn:"ZUÒ HǍO LE · YES",no:"还没有",noEn:"HÁI MÉI YǑU · NOT YET"});
}
function askDelete(item){
  pending={type:"delete",item};
  showAsk("🗑️","不要这个了吗？","bù yào zhè ge le ma?","REMOVE THIS?",
          item.ic+" "+item.cn+" · "+item.en,
          {yes:"拿走",yesEn:"NÁ ZǑU · REMOVE",no:"留着",noEn:"LIÚ ZHE · KEEP",danger:true});
}
function showAsk(em,q,py,en,itemLine,v){
  v = v || {};
  document.getElementById("askEmoji").textContent=em;
  document.getElementById("askQ").textContent=q;
  document.getElementById("askPy").textContent=py;
  document.getElementById("askEn").textContent=en;
  document.getElementById("askItem").textContent=itemLine;
  const yes=document.getElementById("askYes"), no=document.getElementById("askNo");
  yes.innerHTML = (v.yes||"好") + '<small>' + (v.yesEn||"HǍO · YES") + '</small>';
  no.innerHTML  = (v.no ||"不") + '<small>' + (v.noEn ||"BÙ · NO")  + '</small>';
  yes.className = v.danger ? "yes danger" : "yes";
  document.getElementById("mask").classList.add("on");
  beep(700,.08,"sine",.04);
}
function closeAsk(){ document.getElementById("mask").classList.remove("on"); pending=null; }

document.getElementById("askNo").onclick=function(){ closeAsk(); beep(380,.09,"sine",.04); render(); };
document.getElementById("askYes").onclick=function(){
  if(!pending){ closeAsk(); return; }
  const type=pending.type, item=pending.item;
  const found=findItem(item.id), from=found[0], i=found[1];
  closeAsk();
  if(i<0) return;
  if(type==="complete"){
    state[mode][from].splice(i,1);
    state[mode].done.push(item);
    persist(); chime(); sparkle(); render(); checkAll();
  }else{
    state[mode][from].splice(i,1);
    persist(); beep(300,.16,"sawtooth",.05); render();
  }
};

function sparkle(x,y){
  x=x||window.innerWidth/2; y=y||window.innerHeight/2;
  const ch=["⭐","✨","🎈","🌟","💚","🧡"];
  for(let i=0;i<10;i++){
    const s=document.createElement("div"); s.className="spark";
    s.textContent=ch[Math.floor(Math.random()*ch.length)];
    s.style.left=x+"px"; s.style.top=y+"px";
    s.style.setProperty("--dx",(Math.random()*240-120)+"px");
    s.style.setProperty("--dy",(-Math.random()*170-40)+"px");
    s.style.setProperty("--rot",(Math.random()*120-60)+"deg");
    document.body.appendChild(s); setTimeout(()=>s.remove(),950);
  }
}
function checkAll(){
  if(state[mode].todo.length===0&&state[mode].doing.length===0&&state[mode].done.length>0){
    document.getElementById("partySub").textContent =
      mode==="morning"?"早上全部做完啦，出门咯！":"晚上全部做完啦，晚安！";
    document.getElementById("party").classList.add("on");
    fanfare();
  }
}

function setMode(m){
  mode=m;
  const s=state[mode];
  if(s.todo.length===0&&s.doing.length===0&&s.done.length===0){ build(); return; }
  persist(); render();
}
document.getElementById("btnMorning").onclick=function(){setMode("morning")};
document.getElementById("btnNight").onclick=function(){setMode("night")};
document.getElementById("btnReset").onclick=function(){ build(); beep(400,.1,"sine",.045); };
document.getElementById("partyClose").onclick=function(){
  document.getElementById("party").classList.remove("on"); build();
};

if(loadSaved()) render(); else build();
</script>
</body>
</html>
